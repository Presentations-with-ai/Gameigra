<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Своя игра — Глобализация</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:white;background:radial-gradient(circle at top,#163f92 0%,#071c55 45%,#020b27 100%)}
.container{width:min(1200px,95%);margin:auto;padding:30px 0 50px} header{text-align:center;margin-bottom:25px}
h1{margin:0;font-size:clamp(36px,6vw,72px);text-transform:uppercase;letter-spacing:4px;color:#ffd84d;text-shadow:0 4px 20px rgba(0,0,0,.6)}
.subtitle{margin-top:8px;color:#b9ccff;font-size:18px}.score-panel{display:flex;justify-content:center;gap:15px;margin:25px 0;flex-wrap:wrap}
.score-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 25px;min-width:170px;text-align:center}
.score-label{color:#a9bce9;font-size:13px;text-transform:uppercase}.score{font-size:30px;color:#ffd84d;font-weight:bold}
.board-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}.board{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:9px;min-width:660px}.category{min-height:90px;background:linear-gradient(180deg,#1643a0,#0b2872);border:2px solid #5478cc;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:bold;text-transform:uppercase;font-size:15px;border-radius:8px}
.question-btn{height:105px;border:2px solid #345cb7;border-radius:8px;background:linear-gradient(145deg,#123d9b,#061d62);color:#ffd84d;font-size:31px;font-weight:900;cursor:pointer;transition:.2s}
.question-btn:hover{transform:scale(1.04);background:#194caf;box-shadow:0 0 25px rgba(69,119,255,.45)}.question-btn.used{opacity:.12;cursor:default;pointer-events:none}
.controls{display:flex;justify-content:center;margin-top:25px}.reset{padding:11px 25px;border:1px solid #5676be;background:rgba(255,255,255,.07);color:white;border-radius:10px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,5,25,.94);backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:100;padding:20px}.modal.active{display:flex}
.modal-card{width:min(900px,95%);min-height:500px;border:2px solid #406bd0;border-radius:25px;background:radial-gradient(circle at top,#16449f,#071b55 60%,#020a27);box-shadow:0 30px 100px black;padding:35px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.points{color:#ffd84d;font-weight:bold;font-size:24px}.question{font-size:clamp(25px,4vw,42px);line-height:1.3;margin:35px 0}.answer{display:none;padding:22px;margin:15px 0;border-radius:15px;background:rgba(46,210,128,.12);border:1px solid #39cc85;font-size:24px;color:#8cffbe}.answer.show{display:block}
.modal-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.btn{border:none;padding:14px 24px;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}.show-answer{background:#ffd84d;color:#071638}.correct{background:#31c778;color:white}.wrong{background:#e64d5d;color:white}.close{background:#415887;color:white}
@media(max-width:700px){.container{width:96%;padding-top:18px}.board{grid-template-columns:repeat(4,minmax(145px,1fr));min-width:620px}.question-btn{height:82px;font-size:25px}.category{min-height:78px;font-size:12px}.modal-card{min-height:420px;padding:22px}.question{font-size:26px}}
</style>
</head>
<body>
<div class="container"><header><h1>Своя игра</h1><div class="subtitle">Глобализация мировой экономики</div></header>
<div class="score-panel"><div class="score-box"><div class="score-label">Ваш счёт</div><div class="score" id="score">0</div></div><div class="score-box"><div class="score-label">Осталось вопросов</div><div class="score" id="remaining">20</div></div></div>
<div class="board-wrap"><div class="board" id="board"></div></div><div class="controls"><button class="reset" onclick="resetGame()">Начать заново</button></div></div>
<div class="modal" id="modal"><div class="modal-card"><div class="points" id="modalPoints"></div><div class="question" id="modalQuestion"></div><div class="answer" id="modalAnswer"></div>
<div class="modal-buttons"><button class="btn show-answer" onclick="showAnswer()">Показать ответ</button><button class="btn correct" onclick="finishQuestion(true)">✓ Правильно</button><button class="btn wrong" onclick="finishQuestion(false)">✕ Неправильно</button><button class="btn close" onclick="closeModal()">Закрыть</button></div></div></div>
<script>
const categories=[
{name:"Основы глобализации",questions:[
{points:100,q:"Что такое глобализация?",a:"Процесс интеграции государств и народов в разных областях деятельности."},
{points:200,q:"В какой сфере тенденция к стиранию границ проявляется особенно сильно?",a:"В экономике."},
{points:300,q:"Что происходит с национальными экономиками в условиях глобализации?",a:"Возрастает их взаимное влияние и взаимозависимость."},
{points:400,q:"Что считается символом экономической глобализации?",a:"Транснациональные корпорации (ТНК)."},
{points:500,q:"Назовите три измерения глобализации.",a:"Глобализация как объективная тенденция, как методология и как цель."}]},
{name:"Теории и учёные",questions:[
{points:100,q:"Кто является автором теории мировой системы?",a:"Иммануил Валлерстайн."},
{points:200,q:"Из каких трёх элементов состоит мировая система Валлерстайна?",a:"Ядро, полупериферия и периферия."},
{points:300,q:"Кто ввёл понятие «глокализация»?",a:"Роланд Робертсон."},
{points:400,q:"Что означает глокализация?",a:"Сочетание глобальных и локальных процессов."},
{points:500,q:"Как Мануэл Кастельс объясняет глобализацию?",a:"Как следствие информационно-технологической революции и формирования сетевой экономики."}]},
{name:"Этапы глобализации",questions:[
{points:100,q:"Как называется этап глобализации XV–XVIII веков?",a:"Прото-глобализация."},
{points:200,q:"Что способствовало ранней индустриальной глобализации?",a:"Промышленный переворот, паровой двигатель, железные дороги, телеграф и развитие международной торговли."},
{points:300,q:"Какой период характеризуется деглобализацией из-за мировых войн и Великой депрессии?",a:"1914–1945 годы."},
{points:400,q:"Какие международные институты связаны с послевоенной глобализацией?",a:"МВФ, Всемирный банк и ГАТТ."},
{points:500,q:"Что характеризует современную цифровую глобализацию XXI века?",a:"Цифровые технологии, сервисная экономика, глобальные IT-компании, зелёная экономика и рост транснациональных сетей."}]},
{name:"Направления и критика",questions:[
{points:100,q:"Какие три основных научных направления глобализации рассматриваются в презентации?",a:"Гиперглобалистское, скептическое и трансформационное."},
{points:200,q:"Как гиперглобалисты относятся к роли национальных границ?",a:"Считают, что по мере развития свободной торговли и капиталовложений национальные границы постепенно стираются."},
{points:300,q:"Что утверждают скептики о роли государства?",a:"Национальные государства продолжают сохранять ключевую роль."},
{points:400,q:"Кто является известным критиком традиционной модели Вашингтонского консенсуса?",a:"Джозеф Стиглиц."},
{points:500,q:"В чём основная идея позиции Стиглица по глобализации?",a:"Глобализация может приносить пользу, но её правила должны быть справедливыми и учитывать интересы слабых участников."}]}
];
let score=0,remaining=20,currentQuestion=null,currentButton=null;
const board=document.getElementById("board");
function createBoard(){board.innerHTML="";categories.forEach(c=>{const d=document.createElement("div");d.className="category";d.textContent=c.name;board.appendChild(d)});for(let i=0;i<5;i++)categories.forEach(c=>{const q=c.questions[i],b=document.createElement("button");b.className="question-btn";b.textContent=q.points;b.onclick=()=>openQuestion(q,b);board.appendChild(b)})}
function openQuestion(q,b){currentQuestion=q;currentButton=b;document.getElementById("modalPoints").textContent=q.points+" очков";document.getElementById("modalQuestion").textContent=q.q;document.getElementById("modalAnswer").textContent=q.a;document.getElementById("modalAnswer").classList.remove("show");document.getElementById("modal").classList.add("active")}
function showAnswer(){document.getElementById("modalAnswer").classList.add("show")}
function finishQuestion(ok){if(!currentQuestion)return;if(ok)score+=currentQuestion.points;else score-=currentQuestion.points;remaining--;document.getElementById("score").textContent=score;document.getElementById("remaining").textContent=remaining;currentButton.classList.add("used");closeModal();currentQuestion=null;currentButton=null;if(remaining===0)setTimeout(()=>alert("Игра окончена! Ваш итоговый счёт: "+score),300)}
function closeModal(){document.getElementById("modal").classList.remove("active")}
function resetGame(){score=0;remaining=20;document.getElementById("score").textContent=0;document.getElementById("remaining").textContent=20;createBoard()}
document.getElementById("modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});createBoard();
</script>
</body></html>
